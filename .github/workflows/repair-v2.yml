name: Repair and deploy Lenterne V2

on:
  push:
    branches: [v2-stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lenterne-v2-repair
  cancel-in-progress: false

jobs:
  repair-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout V2 stable
        uses: actions/checkout@v4
        with:
          ref: v2-stable
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Materialize stable V2 CSS locally
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 3 \
            -H 'Cache-Control: no-cache' \
            'https://lenterne-v2-brindes.vercel.app/v2-base.css?recovery=20260725' \
            -o /tmp/v2-base.css

          test "$(wc -c < /tmp/v2-base.css)" -gt 10000
          grep -q '.commerce-home' /tmp/v2-base.css
          grep -q '.catalog-page' /tmp/v2-base.css
          grep -q '.product-detail' /tmp/v2-base.css
          grep -q '.quote-page' /tmp/v2-base.css
          grep -q '.cart-page' /tmp/v2-base.css
          grep -q '.account-page' /tmp/v2-base.css
          grep -q '.manager-page' /tmp/v2-base.css

          cp /tmp/v2-base.css apps/brindes/public/v2-base.css
          cp /tmp/v2-base.css apps/ferragens/public/v2-base.css

          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.scripts.prebuild;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          for (const file of ['apps/brindes/app/layout.tsx', 'apps/ferragens/app/layout.tsx']) {
            let text = fs.readFileSync(file, 'utf8');
            text = text.replace(/\/v2-base\.css(?:\?[^"']*)?/g, '/v2-base.css?v=stable-20260725');
            fs.writeFileSync(file, text);
          }
          NODE

          rm -f scripts/materialize-v2-css.mjs

      - name: Install and build every V2 workspace
        run: |
          npm ci
          npm run build

      - name: Save stable V2 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'felpacontato'
          git config user.email 'felpacontato@gmail.com'
          git add package.json apps/brindes/app/layout.tsx apps/ferragens/app/layout.tsx apps/brindes/public/v2-base.css apps/ferragens/public/v2-base.css
          git add -u scripts/materialize-v2-css.mjs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'fix(v2): restaura CSS local e estabiliza páginas internas [v2-stabilized]'
            git push origin HEAD:v2-stable
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Require Vercel deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Repository secret VERCEL_TOKEN is missing'; exit 1; }

      - name: Deploy Brindes V2 production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_WWoykamFxsshULvvbueAte28
          VERCEL_PROJECT_ID: prj_pYw9lekWLVi5mD97sERe3njMc0sb
        run: npx vercel@54.18.7 --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy Ferragens V2 production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_WWoykamFxsshULvvbueAte28
          VERCEL_PROJECT_ID: prj_JGyjX86o1XSTvzBdfBtWCqXQh4a2
        run: npx vercel@54.18.7 --prod --yes --token="$VERCEL_TOKEN"

      - name: Audit all published V2 routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(/ /catalogo /sobre /orcamento /carrinho /conta /gerente /privacidade /trocas)
          for host in lenterne-v2-brindes.vercel.app lenterne-v2-ferragens.vercel.app; do
            for route in "${routes[@]}"; do
              code="$(curl --silent --location --output /tmp/page.html --write-out '%{http_code}' --retry 3 "https://${host}${route}?audit=${GITHUB_RUN_ID}")"
              test "$code" = 200
              ! grep -qiE 'Application error|Internal Server Error|This page could not be found' /tmp/page.html
            done
            css_code="$(curl --silent --location --output /tmp/live.css --write-out '%{http_code}' "https://${host}/v2-base.css?v=stable-20260725")"
            test "$css_code" = 200
            test "$(wc -c < /tmp/live.css)" -gt 10000
          done
