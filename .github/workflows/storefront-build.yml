name: Storefront build

on:
  push:
    branches:
      - main
      - v3
  pull_request:
    branches:
      - main
      - v3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [v1, v3]
    env:
      VERCEL_PROJECT_PRODUCTION_URL: lenterne-${{ matrix.version }}-brindes.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build ${{ matrix.version }}
        run: npm run build
      - name: Package validated source
        uses: actions/upload-artifact@v4
        with:
          name: lenterne-${{ matrix.version }}-source-${{ github.sha }}
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git/**
            !node_modules/**
            !**/node_modules/**
            !**/.next/**
            !**/dist/**
